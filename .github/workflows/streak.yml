name: 3-Year Daily Streak

on:
  schedule:
    # Runs at 02:00 UTC (07:30 AM IST) and 14:00 UTC (07:30 PM IST) every day
    - cron: '0 2,14 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  daily-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run daily update script
        run: python scripts/daily_update.py

      - name: Commit and push daily streak
        run: |
          git config --global user.name "AYUSH GUPTA"
          git config --global user.email "25ug1byai286@bmsit.in"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes detected to commit."
          else
            STREAK_DAY=$(python -c 'import json; print(json.load(open("data/streak_data.json"))["current_streak"])')
            git commit -m "🔥 Day ${STREAK_DAY} Streak: $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Use native GitHub API keepalive to avoid third-party action access policies.
      - name: Self-Keepalive (Guarantee active workflow state)
        run: |
          echo "Verifying workflow active state via GitHub REST API..."
          curl -s -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/streak.yml/enable || true
          echo "Workflow keepalive verified."
