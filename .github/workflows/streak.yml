name: 3-Year Daily Streak

on:
  schedule:
    # 5 daily off-peak triggers during daytime IST (where UTC and IST share the exact same calendar date):
    - cron: '17 2 * * *'   # 07:47 AM IST
    - cron: '43 5 * * *'   # 11:13 AM IST
    - cron: '19 9 * * *'   # 02:49 PM IST
    - cron: '47 13 * * *'  # 07:17 PM IST
    - cron: '13 17 * * *'  # 10:43 PM IST
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  TZ: Asia/Kolkata

jobs:
  daily-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run daily update script
        run: python scripts/daily_update.py

      - name: Commit and push daily streak
        run: |
          git config --global user.name "AYUSH GUPTA"
          git config --global user.email "25ug1byai286@bmsit.in"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes detected to commit."
          else
            STREAK_DAY=$(python -c 'import json; print(json.load(open("data/streak_data.json"))["current_streak"])')
            export TZ=Asia/Kolkata
            git commit -m "🔥 Day ${STREAK_DAY} Streak: $(date '+%Y-%m-%d %H:%M IST') [skip ci]"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: Asia/Kolkata

      # Use native GitHub API keepalive to avoid third-party action access policies.
      - name: Self-Keepalive (Guarantee active workflow state)
        run: |
          echo "Verifying workflow active state via GitHub REST API..."
          curl -s -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/streak.yml/enable || true
          echo "Workflow keepalive verified."
