name: 3-Year Daily Streak & Keepalive

on:
  schedule:
    # Runs at 02:00 UTC (07:30 AM IST) and 14:00 UTC (07:30 PM IST) every day
    - cron: '0 2,14 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  streak-and-keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run daily update script
        run: python scripts/daily_update.py

      - name: Commit and push changes
        run: |
          git config --global user.name "AYUSH GUPTA"
          git config --global user.email "25ug1byai286@bmsit.in"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes detected to commit."
          else
            git commit -m "🔥 Day $(python -c 'import json; print(json.load(open("data/streak_data.json"))["current_streak"])') Streak: $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keepalive Workflow (Prevent 60-day GitHub auto-pause)
        uses: gautamkrishnar/keepalive-workflow@v2
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          time_elapsed: 45
